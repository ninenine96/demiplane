name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply remote D1 migrations before deploying
        type: boolean
        default: false

# One deploy at a time per branch, and never cancel one halfway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The gate itself lives in @ninenine96/deploy; this file only supplies
      # the credentials. Migrations stay behind the manual-dispatch input.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create a Cloudflare API token (Workers Scripts:Edit, D1:Edit, Workers Routes:Edit) and run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --no-install armory-deploy ${{ inputs.migrate && '--migrate' || '' }}
