name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply remote D1 migrations before deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # One definition of the gate, in ninenine96/armory. Checks, migration
    # policy and the Wrangler invocation live there, not here.
    uses: ninenine96/armory/.github/workflows/deploy-worker.yml@main
    with:
      migrate: ${{ inputs.migrate || false }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
