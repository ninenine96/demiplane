name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply remote D1 migrations before deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # One definition of the gate, in ninenine96/armory. Scheduled deploys,
    # checks and migration policy live there, not here.
    uses: ninenine96/armory/.github/workflows/deploy-worker.yml@v0.1.1
    secrets: inherit
    with:
      migrate: ${{ inputs.migrate || false }}
